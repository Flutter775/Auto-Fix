name: Auto Fix Flutter Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      zip_path:
        description: 'Path to ZIP file'
        required: false
        default: 'build/app/outputs/flutter-apk/app-release.zip'

jobs:
  auto-fix:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip zip jq curl
    
    - name: Download ZIP if provided
      if: github.event.inputs.zip_path != ''
      run: |
        if [ -f "${{ github.event.inputs.zip_path }}" ]; then
          cp "${{ github.event.inputs.zip_path }}" project.zip
        else
          echo "ZIP file not found, creating from project"
          zip -r project.zip . -x "*.git*" "*.github*" "node_modules/*" "build/*"
        fi
    
    - name: Create project ZIP
      if: github.event.inputs.zip_path == ''
      run: |
        zip -r project.zip . -x "*.git*" "*.github*" "node_modules/*" "build/*" "*.zip"
    
    - name: Extract ZIP
      run: |
        mkdir project_extracted
        unzip project.zip -d project_extracted
        
    - name: Fix pubspec.yaml
      run: |
        cd project_extracted
        if [ -f "pubspec.yaml" ]; then
          # Fix tab indent to spaces
          sed -i 's/\t/  /g' pubspec.yaml
          # Fix dependencies format
          sed -i '/^[[:space:]]*$/d' pubspec.yaml
          # Add missing dependencies if needed
          if ! grep -q "flutter:" pubspec.yaml; then
            echo "" >> pubspec.yaml
            echo "flutter:" >> pubspec.yaml
            echo "  uses-material-design: true" >> pubspec.yaml
          fi
        fi
    
    - name: Fix build.gradle (app level)
      run: |
        cd project_extracted
        if [ -f "android/app/build.gradle" ]; then
          # Fix compileSdkVersion
          sed -i 's/compileSdkVersion [0-9]*/compileSdkVersion 34/g' android/app/build.gradle
          sed -i 's/compileSdk [0-9]*/compileSdk 34/g' android/app/build.gradle
          
          # Fix minSdkVersion
          sed -i 's/minSdkVersion [0-9]*/minSdkVersion 21/g' android/app/build.gradle
          
          # Fix targetSdkVersion
          sed -i 's/targetSdkVersion [0-9]*/targetSdkVersion 34/g' android/app/build.gradle
          
          # Add namespace if missing
          if ! grep -q "namespace" android/app/build.gradle; then
            sed -i '/android {/a \    namespace "com.example.app"' android/app/build.gradle
          fi
        fi
    
    - name: Fix build.gradle (project level)
      run: |
        cd project_extracted
        if [ -f "android/build.gradle" ]; then
          # Fix Gradle version
          sed -i 's/classpath "com.android.tools.build:gradle:[0-9.]*"/classpath "com.android.tools.build:gradle:7.4.2"/g' android/build.gradle
          sed -i "s/classpath 'com.android.tools.build:gradle:[0-9.]*'/classpath 'com.android.tools.build:gradle:7.4.2'/g" android/build.gradle
          
          # Fix Kotlin version
          if grep -q "kotlin" android/build.gradle; then
            sed -i 's/ext.kotlin_version = "[0-9.]*"/ext.kotlin_version = "1.9.0"/g' android/build.gradle
          fi
        fi
    
    - name: Fix gradle-wrapper.properties
      run: |
        cd project_extracted
        if [ -f "android/gradle/wrapper/gradle-wrapper.properties" ]; then
          sed -i 's/distributionUrl=.*/distributionUrl=https\\:\\/\\/services.gradle.org\\/distributions\\/gradle-7.6.3-all.zip/g' android/gradle/wrapper/gradle-wrapper.properties
        fi
    
    - name: Fix .dart_tool issues
      run: |
        cd project_extracted
        # Clean .dart_tool if exists
        if [ -d ".dart_tool" ]; then
          rm -rf .dart_tool
        fi
        
        # Fix any remaining Dart issues
        if [ -f "pubspec.yaml" ]; then
          flutter pub get || true
        fi
    
    - name: Run Groq AI Analysis
      id: groq_analysis
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        cd project_extracted
        
        # Collect error logs
        flutter clean || true
        flutter pub get 2>&1 | tee pub_get.log
        flutter build apk --debug 2>&1 | tee build_errors.log || true
        
        # Prepare analysis data
        echo "=== PUBSPEC.YAML ===" > analysis_data.txt
        cat pubspec.yaml >> analysis_data.txt
        echo "" >> analysis_data.txt
        
        echo "=== BUILD.GRADLE (APP) ===" >> analysis_data.txt
        cat android/app/build.gradle >> analysis_data.txt
        echo "" >> analysis_data.txt
        
        echo "=== BUILD ERRORS ===" >> analysis_data.txt
        if [ -f "build_errors.log" ]; then
          cat build_errors.log >> analysis_data.txt
        fi
        
        echo "=== PUB GET ERRORS ===" >> analysis_data.txt
        if [ -f "pub_get.log" ]; then
          cat pub_get.log >> analysis_data.txt
        fi
        
        # Analyze with Groq
        if [ -n "$GROQ_API_KEY" ]; then
          curl -X POST "https://api.groq.com/openai/v1/chat/completions" \
            -H "Authorization: Bearer $GROQ_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "mixtral-8x7b-32768",
              "messages": [
                {
                  "role": "system",
                  "content": "You are a Flutter build expert. Analyze the following build errors and provide specific manual fixes. Format response as JSON with fields: errors, warnings, fixes, suggestions."
                },
                {
                  "role": "user",
                  "content": "'"$(cat analysis_data.txt | jq -sR .)"'"
                }
              ],
              "temperature": 0.3
            }' > analysis_result.json
        else
          echo "No Groq API key found, skipping AI analysis"
        fi
    
    - name: Apply Groq AI Fixes
      if: env.GROQ_API_KEY != ''
      run: |
        cd project_extracted
        if [ -f "analysis_result.json" ]; then
          # Parse and apply fixes from AI
          echo "AI Analysis completed"
          
          # Extract fixes from JSON
          jq -r '.choices[0].message.content' analysis_result.json > ai_fixes.json
          
          # Apply fixes based on AI suggestions
          # Example: Fix dependencies
          if grep -q "flutter_svg" ai_fixes.json; then
            echo "Applying AI fixes..."
            # Add any suggested fixes here
          fi
        fi
    
    - name: Rebuild project
      run: |
        cd project_extracted
        flutter clean
        flutter pub get
        flutter build apk --release || flutter build apk --debug
        
    - name: Create fixed ZIP
      run: |
        cd project_extracted
        zip -r ../fixed_project.zip . -x "*.git*" "*.github*" "node_modules/*" "build/*" "*.zip"
        
    - name: Upload fixed ZIP
      uses: actions/upload-artifact@v4
      with:
        name: fixed-flutter-project
        path: fixed_project.zip
        
    - name: Upload analysis report
      uses: actions/upload-artifact@v4
      with:
        name: analysis-report
        path: project_extracted/analysis_result.json
        
    - name: Create summary
      run: |
        echo "## Auto Fix Summary" > $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Fixed Issues" >> $GITHUB_STEP_SUMMARY
        echo "- pubspec.yaml formatting" >> $GITHUB_STEP_SUMMARY
        echo "- build.gradle SDK versions" >> $GITHUB_STEP_SUMMARY
        echo "- Gradle wrapper version" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### AI Analysis" >> $GITHUB_STEP_SUMMARY
        if [ -f "project_extracted/analysis_result.json" ]; then
          echo "Check analysis-report artifact for details" >> $GITHUB_STEP_SUMMARY
        else
          echo "No AI analysis performed" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Download" >> $GITHUB_STEP_SUMMARY
        echo "Download fixed project from artifacts" >> $GITHUB_STEP_SUMMARY
